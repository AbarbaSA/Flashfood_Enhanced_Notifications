name: Flashfood Notifier

on:
  schedule:
    # Run every 15 minutes from 7am-8pm Toronto time (13 hours per day)
    # EST (winter): UTC-5, so 7H-20H = 12:00 UTC to 01:00 UTC next day
    # EDT (summer): UTC-4, so 7H-20H = 11:00 UTC to 00:00 UTC
    # Cover both by running 11:00 UTC - 01:00 UTC next day
    - cron: '*/20 11-23 * * *'
    - cron: '*/20 0 * * *'
  workflow_dispatch:  # Allow manual trigger

# it needs write access to delete caches
permissions:
  actions: write

jobs:
  notify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt


      - name: Restore seen items cache
        uses: actions/cache/restore@v4
        with:
          path: seen_items.json
          key: seen-items-${{ github.run_id }}
          restore-keys: |
            seen-items-

      - name: Download config from secret
        run: echo '${{ secrets.CONFIG_JSON }}' > config.json

      - name: Run notifier
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          FLASHFOOD_API_URL: ${{ secrets.FLASHFOOD_API_URL }}
          FLASHFOOD_API_KEY: ${{ secrets.FLASHFOOD_API_KEY }}
          FLASHFOOD_APP_INFO: ${{ secrets.FLASHFOOD_APP_INFO }}
          
        run: python flashfood_notifier.py

      - name: Save seen items for next run
        uses: actions/cache/save@v4
        if: always()
        with:
          path: seen_items.json
          key: seen-items-${{ github.run_id }}

      - name: Delete old seen items caches
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh cache list --key seen-items- --json id,key --jq '.[] | select(.key != "seen-items-${{ github.run_id }}") | .id' | \
                  xargs -I {} gh cache delete {} || true